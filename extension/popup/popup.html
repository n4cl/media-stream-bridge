<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Media Stream Bridge</title>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="../build/extension/src/popup/popup.js"></script>
  </head>
  <body>
    <main>
      <h1>検出したストリーム</h1>
      <p id="candidate-status" role="status">候補を確認しています…</p>
      <p id="status" role="status" hidden></p>
      <button id="cancel-save-button" type="button" hidden>保存をキャンセル</button>
      <form id="candidate-form" hidden>
        <fieldset>
          <legend>保存するストリームを選択</legend>
          <div id="candidate-list"></div>
          <button id="save-button" type="submit">保存</button>
          <details id="save-settings">
            <summary>設定して保存</summary>
            <label for="output-file-name">ファイル名 (.mp4)</label>
            <input id="output-file-name" name="output-file-name" type="text" maxlength="240" autocomplete="off">
            <button id="save-with-settings-button" type="submit">この設定で保存</button>
          </details>
        </fieldset>
      </form>
    </main>
  </body>
</html>
